worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 16M;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/x-font-ttf font/opentype image/svg+xml;

    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    # Required for Streamlit — maps $http_upgrade to "upgrade" or "close"
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstream service definitions ──────────────────────────────────────────
    upstream streamlit  { server streamlit:8501; }
    upstream api        { server api:8000; }
    upstream mlflow_app { server mlflow:5000; }

    # ── HTTP server ───────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (used by certbot --webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ── FastAPI at /api/ ─────────────────────────────────────────────────
        # Strip the /api prefix before forwarding to uvicorn.
        # FastAPI is started with --root-path /api so Swagger UI works correctly.
        location /api/ {
            proxy_pass         http://api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /api;
            proxy_read_timeout 120s;
        }

        # ── MLflow UI at /mlflow/ ────────────────────────────────────────────
        location /mlflow/ {
            proxy_pass         http://mlflow_app/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_redirect     http://mlflow_app/ /mlflow/;
            # Rewrite asset references inside HTML responses
            sub_filter         'href="/'  'href="/mlflow/';
            sub_filter         'src="/'   'src="/mlflow/';
            sub_filter_once    off;
        }

        # ── Streamlit at / (with WebSocket upgrade) ──────────────────────────
        # Must come last so /api/ and /mlflow/ are matched first.
        location / {
            proxy_pass         http://streamlit;
            proxy_http_version 1.1;

            # WebSocket upgrade — critical for Streamlit to function
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Keep long-lived WebSocket connections alive
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;

            # Disable buffering so Streamlit's SSE/websocket frames are
            # forwarded immediately
            proxy_buffering off;
        }
    }

    # ── HTTPS server (uncomment after running certbot) ────────────────────────
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # Copy all location blocks from the HTTP server above
    # }
}
