name: Drift Monitoring

on:
  schedule:
    - cron: "0 2 * * *"  # daily at 02:00 UTC
  workflow_dispatch:       # allow manual trigger from GitHub UI

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  drift-report:
    name: Generate Evidently drift report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run drift report
        id: drift
        run: python scripts/run_drift_report.py
        continue-on-error: true  # exit code 2 = drift, don't fail the step

      - name: Upload drift report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_id }}
          path: reports/drift_report.html

      - name: Create GitHub issue when drift detected
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data drift detected — ${today}`,
              body: [
                "## Evidently drift monitoring alert",
                "",
                "The daily drift monitoring job detected significant data drift",
                "between the training reference distribution and recent predictions.",
                "",
                `**Workflow run:** ${context.runId}`,
                `**Date:** ${today}`,
                "",
                "### Recommended actions",
                "- [ ] Download the drift report artifact from this workflow run",
                "- [ ] Review which features have drifted most",
                "- [ ] Run `dvc repro` to retrain the model with fresh data",
                "- [ ] Verify metrics with `dvc metrics diff`",
                "- [ ] Close this issue once the model is retrained and deployed",
              ].join('\n'),
              labels: ["drift", "model-ops"],
            });
