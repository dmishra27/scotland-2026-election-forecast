name: CD — Deploy to Oracle Cloud

# ── Required GitHub secrets ────────────────────────────────────────────────────
# ORACLE_HOST    — public IP of the Oracle Cloud VM (e.g. 79.72.78.114)
# ORACLE_USER    — SSH username on the VM (e.g. ubuntu or opc)
# ORACLE_SSH_KEY — private SSH key (PEM format, no passphrase) that matches
#                  a public key added to ~/.ssh/authorized_keys on the VM
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Only deploy after all CI jobs pass on main
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: SSH deploy to Oracle VM
    runs-on: ubuntu-latest
    environment: production
    # Gate: skip if CI failed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key:      ${{ secrets.ORACLE_SSH_KEY }}
          port:     22
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${HOME}/scotland-2026-election-forecast"
            COMPOSE="docker compose -f ${APP_DIR}/deploy/docker-compose.prod.yml \
                      --env-file ${APP_DIR}/deploy/.env.prod"

            echo "=== git pull ==="
            git -C "${APP_DIR}" pull origin main

            echo "=== rebuild and restart changed services ==="
            ${COMPOSE} up -d --build

            echo "=== waiting 40 s for health checks ==="
            sleep 40

            echo "=== container status ==="
            ${COMPOSE} ps

            echo "=== API health check ==="
            curl -sf http://localhost:8000/health | python3 -m json.tool

            echo "=== Streamlit health check ==="
            curl -sf http://localhost:8501/_stcore/health

            echo "=== MLflow health check ==="
            curl -sf http://localhost:5000/health | python3 -m json.tool || true

            echo "=== deploy complete ==="

      - name: External health check via public IP
        run: |
          curl --retry 5 --retry-delay 10 --retry-all-errors \
               -sf http://79.72.78.114/api/health \
               | python3 -m json.tool
          echo "Public health check passed."
